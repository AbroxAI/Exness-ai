<script>
(function(){function fit(){const scale=Math.min(1,window.innerWidth/732);document.documentElement.style.setProperty('--scale',String(scale));}fit();window.addEventListener('resize',fit,{passive:true});})();
function go(target){if(target==='quotes') location.href='index.html';else if(target==='dashboard') location.href='dashboard.html';else location.href=target+'.html';}
document.querySelectorAll('[role="button"]').forEach(function(item){item.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();item.click()}})});


/* Professional touch zoom: candles are clipped to the 594px plot; price axis stays fixed; vertical swipe scrolls to the full RSI/date axis. */
(function(){
  const wrap=document.querySelector('.chart-wrap');
  const plot=document.getElementById('zoomPlot');
  if(!wrap||!plot) return;

  let scale=1;
  let tx=0;
  let mode='none';
  let startX=0;
  let startY=0;
  let startTx=0;
  let gesture='none';
  let pinchStartDist=1;
  let pinchStartScale=1;
  let pinchCenter=0;
  let pinchStartTx=0;
  let lastTap=0;

  function viewScale(){
    const r=wrap.getBoundingClientRect();
    return r.width/732 || 1;
  }
  function clamp(v,a,b){return Math.max(a,Math.min(b,v));}
  function clampTx(v,s){
    const min=Math.min(0,594-(594*s));
    const max=0;
    return clamp(v,min,max);
  }
  function render(){
    tx=clampTx(tx,scale);
    plot.setAttribute('transform','translate('+tx.toFixed(2)+' 0) scale('+scale.toFixed(4)+' 1)');
    const labels=document.getElementById('priceLabels');
    if(labels){
      const fs=Math.max(12,Math.min(15,15/Math.pow(scale,0.22)));
      labels.setAttribute('font-size',fs.toFixed(2));
    }
  }
  function localX(t){
    const r=wrap.getBoundingClientRect();
    return (t.clientX-r.left)/viewScale();
  }
  function dist(a,b){return Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY);}
  function center(a,b){return (localX(a)+localX(b))/2;}

  wrap.addEventListener('touchstart',function(e){
    if(e.touches.length===1){
      const now=Date.now();
      if(now-lastTap<280){
        scale=1;tx=0;render();lastTap=0;e.preventDefault();return;
      }
      lastTap=now;
      mode='pending';
      gesture='undecided';
      startX=localX(e.touches[0]);
      startY=e.touches[0].clientY;
      startTx=tx;
    } else if(e.touches.length===2){
      mode='pinch';
      gesture='pinch';
      pinchStartDist=Math.max(1,dist(e.touches[0],e.touches[1]));
      pinchStartScale=scale;
      pinchCenter=center(e.touches[0],e.touches[1]);
      pinchStartTx=tx;
      e.preventDefault();
    }
  },{passive:false});

  wrap.addEventListener('touchmove',function(e){
    if(e.touches.length===2 && mode==='pinch'){
      const d=Math.max(1,dist(e.touches[0],e.touches[1]));
      const next=clamp(pinchStartScale*(d/pinchStartDist),0.60,3.0);
      tx=pinchCenter-(pinchCenter-pinchStartTx)*(next/pinchStartScale);
      scale=next;
      render();
      e.preventDefault();
      return;
    }
    if(e.touches.length===1 && (mode==='pending'||mode==='pan')){
      const x=localX(e.touches[0]);
      const y=e.touches[0].clientY;
      const dx=x-startX;
      const dy=y-startY;
      if(mode==='pending'){
        if(Math.abs(dy)>Math.abs(dx)+4){
          gesture='scroll';
          mode='scroll';
          return;
        }
        if(Math.abs(dx)>4){
          gesture='pan';
          mode='pan';
          startX=x;
          startTx=tx;
        }else{
          return;
        }
      }
      if(mode==='pan'){
        tx=clampTx(startTx+(x-startX),scale);
        render();
        e.preventDefault();
      }
    }
  },{passive:false});

  wrap.addEventListener('touchend',function(e){
    if(e.touches.length===0) mode='none';
    else if(e.touches.length===1){
      mode='pending';
      gesture='undecided';
      startX=localX(e.touches[0]);
      startY=e.touches[0].clientY;
      startTx=tx;
    }
  },{passive:false});

  wrap.addEventListener('touchcancel',function(){mode='none';gesture='none'},{passive:true});
  render();
})();

</script>
</body>
</html>
